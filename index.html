<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oliveira | Web Designer & Developer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F5F1EB;
      color: #4B2E2E;
      margin: 0;
      transition: all 0.3s ease;
    }
    header, footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #D4AF37;
    }
    nav a {
      margin: 0 10px;
      text-decoration: none;
      color: #4B2E2E;
      font-weight: 600;
    }
    nav a:hover {
      color: #D4AF37;
    }
    h2 {
      font-family: 'Playfair Display', serif;
    }
    section {
      padding: 60px 20px;
      text-align: center;
    }
    .grid {
      display: grid;
      gap: 20px;
    }
    @media(min-width:768px) {
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .card {
      padding: 20px;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    button {
      background-color: #D4AF37;
      color: #4B2E2E;
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #4B2E2E;
      color: #F5F1EB;
    }

    /* Tema escuro */
    body.dark {
      background-color: #4B2E2E;
      color: #F5F1EB;
    }
    body.dark nav a {
      color: #D4AF37;
    }
    body.dark nav a:hover {
      color: #F5F1EB;
    }
    body.dark button {
      background-color: #D4AF37;
      color: #4B2E2E;
    }
    body.dark button:hover {
      background-color: #F5F1EB;
      color: #4B2E2E;
    }
  </style>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="assets/logo.png" alt="Logo Oliveira" style="height:80px; margin-bottom:10px;">
    <nav>
      <a href="#sobre">Sobre mim</a>
      <a href="#servicos">Serviços</a>
      <a href="#projetos">Projetos</a>
      <a href="#orcamento">
